[workspace]
resolver = "2"
members = [
    "crates/vor-core",
    "crates/vor-import",
    "crates/vor-format",
    "crates/vor-sim",
    "crates/vor-render",
    "crates/vor-edit",
    "crates/vor-app",
    "crates/vor-cli",
]

[workspace.package]
version = "0.3.0"
authors = ["hanserlodev <hanserlodev@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/hanserlodev/voronia"
homepage = "https://github.com/hanserlodev/voronia"
readme = "README.md"
keywords = ["fantasy", "map", "generator", "wgpu", "procedural"]
categories = ["game-development", "graphics"]

[workspace.dependencies]
# Common dependencies for all crates
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.5"
glam = "0.27"
lyon = "1.0"
noise = "0.9"
petgraph = "0.6"
rand = "0.8"
rand_pcg = "0.3"
flate2 = "1.0"
# Render / app stack (Fase 2+)
wgpu = "22"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
egui = "0.29"
egui-wgpu = { version = "0.29", default-features = false }
egui-winit = { version = "0.29", default-features = false, features = ["wayland", "x11", "clipboard"] }
pollster = "0.3"
bytemuck = { version = "1.21", features = ["derive"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
glyphon = "0.6"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
