[workspace]
members = [
    "crates/vor-core",
    "crates/vor-import",
    "crates/vor-format",
    "crates/vor-sim",
    "crates/vor-render",
    "crates/vor-edit",
    "crates/vor-app",
    "crates/vor-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Hans <hanserlodev@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/hanserlodev/voronia"
homepage = "https://github.com/hanserlodev/voronia"
readme = "README.md"
keywords = ["fantasy", "map", "generator", "wgpu", "procedural"]
categories = ["game-development", "graphics"]

[workspace.dependencies]
# Common dependencies for all crates
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.5"
glam = "0.27"
lyon = "0.18"
noise = "0.9"
petgraph = "0.6"
rand = "0.8"
rand_pcg = "0.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
